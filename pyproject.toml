[project]
name = "chiba-heavy-rain"
version = "0.1.0"
description = "GEV return-period analysis of the August 2026 Chiba heavy rainfall using JMA observations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "adjusttext>=1.3",
  "beautifulsoup4>=4.13",
  "cartopy>=0.23",
  "httpx>=0.28",
  "lxml>=5.4",
  "matplotlib>=3.10",
  "numpy>=2.2",
  "pandas>=2.2",
  "scipy>=1.15",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
chiba-rain = "chiba_heavy_rain.analysis:main"
chiba-rain-daily-vs-24h = "chiba_heavy_rain.daily_vs_24h:main"
chiba-rain-nusdas = "chiba_heavy_rain.nusdas_rain:main"
chiba-rain-municipal-rankings = "chiba_heavy_rain.municipal_rankings:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chiba_heavy_rain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
